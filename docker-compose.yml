services:
  n8n:
    image: n8nio/n8n:2.44.6
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/project
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/home/node/project

  nemo-normalizer:
    build: ./nemo-normalizer
    platform: linux/amd64
    container_name: nemo-normalizer
    ports:
      - "8765:8000"
    restart: unless-stopped

  stirling-pdf:
    image: stirlingtools/stirling-pdf:3.2.1
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SECURITY_ENABLELOGIN: "false"
      JAVA_TOOL_OPTIONS: "-Dcom.sun.net.ssl.checkRevocation=true -Dcom.sun.security.enableCRLDP=true"

networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: d2v-bridge

volumes:
  n8n_data:
    name: d2v_n8n_data
