services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/project
      N8N_DEFAULT_BINARY_DATA_MODE: default
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/home/node/project

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    ports:
      - "8080:8080"
    environment:
      SECURITY_ENABLELOGIN: "false"

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama

volumes:
  n8n_data:
  ollama_data:
