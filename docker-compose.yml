services:
  n8n:
    image: n8nio/n8n:2.41.7
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/project
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/home/node/project

  nemo-normalizer:
    build: ./nemo-normalizer
    platform: linux/amd64
    container_name: nemo-normalizer
    ports:
      - "8765:8000"
    restart: unless-stopped

  stirling-pdf:
    image: stirlingtools/stirling-pdf:2.14.3
    container_name: stirling-pdf
    ports:
      - "8080:8080"
    environment:
      SECURITY_ENABLELOGIN: "false"

volumes:
  n8n_data:
    name: d2v_n8n_data
