name: Hadolint

on:
  push:
    branches: [main]
    paths:
      - "nemo-normalizer/Dockerfile"
  pull_request:
    paths:
      - "nemo-normalizer/Dockerfile"

permissions:
  contents: read
  security-events: write

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run hadolint
        run: docker run --rm -v "$PWD":/workdir -w /workdir hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --format sarif nemo-normalizer/Dockerfile | tee hadolint.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint.sarif
