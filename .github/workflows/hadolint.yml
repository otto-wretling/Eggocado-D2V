name: Hadolint

on:
  push:
    branches: [main]
    paths:
      - "nemo-normalizer/Dockerfile"
  pull_request:
    paths:
      - "nemo-normalizer/Dockerfile"

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run hadolint
        run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3008 - < nemo-normalizer/Dockerfile
